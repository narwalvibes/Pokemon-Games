<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Games...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .message {
            text-align: center;
            color: #333;
            max-width: 400px;
            padding: 20px;
        }
        .countdown {
            font-weight: bold;
            color: #ff4757;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <div class="message">
        <h2>Opening Game Tab...</h2>
        <p>If the new tab didn't open, please look at your browser's address bar to <strong>allow pop-ups</strong>.</p>
        <p>This page will clear automatically in <span id="timer" class="countdown">10</span> seconds.</p>
    </div>

    <script>
        (function() {
            const targetUrl = "https://playgbagames.vercel.app/";

            // 1. Attempt to open the target site inside a new tab immediately
            const newTab = window.open("about:blank", "_blank");

            if (newTab) {
                const doc = newTab.document;
                doc.title = "Pokemon Games";
                doc.body.style.margin = "0";
                doc.body.style.height = "100vh";
                doc.body.style.overflow = "hidden";

                const iframe = doc.createElement("iframe");
                iframe.src = targetUrl;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";
                
                // Enable fullscreen permissions for the iframe
                iframe.allowFullscreen = true; 
                iframe.setAttribute("allowfullscreen", "true");
                
                doc.body.appendChild(iframe);
            }

            // 2. Visual countdown timer
            let secondsLeft = 5;
            const timerDisplay = document.getElementById("timer");
            
            const countdownInterval = setInterval(function() {
                secondsLeft--;
                if (timerDisplay) {
                    timerDisplay.textContent = secondsLeft;
                }
                if (secondsLeft <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            // 3. Wait 5 seconds before closing/clearing the loader page
            setTimeout(function() {
                window.close();
                window.location.replace("about:blank");
            }, 5000);
        })();
    </script>

</body>
</html>
